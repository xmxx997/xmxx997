
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evoimpression Design Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --studio-accent: #FFFFFF;
        --studio-bg: #000000;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #000000;
        color: #FFFFFF;
        margin: 0;
        overflow-x: hidden;
      }
      
      /* Reset any forced italics from browser defaults if any */
      i, em, .italic {
        font-style: normal !important;
      }

      /* Custom Scrollbar - Grayscale */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #000;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #FFF;
      }

      /* Architectural Grid Background - Grayscale */
      .architect-grid {
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), 
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        position: relative;
      }
      .architect-grid::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at 50% 50%, transparent 0%, #000 90%);
        pointer-events: none;
      }

      /* Focus Card Styling - B&W */
      .focus-card {
        background: rgba(15, 15, 15, 0.9);
        border: 1px solid #333;
        transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        overflow: hidden;
      }
      .focus-card:hover {
        border-color: #FFF;
        background: #000;
        transform: translateY(-4px);
      }

      /* Ticker Scanline Effect - White */
      .scanner-line {
        position: absolute;
        height: 100%;
        width: 1px;
        background: #FFF;
        box-shadow: 0 0 10px #FFF;
        animation: scan 6s linear infinite;
        opacity: 0.2;
        z-index: 10;
        pointer-events: none;
      }
      @keyframes scan {
        0% { left: 0%; }
        100% { left: 100%; }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3"
      }
    }
    </script>
  </head>
  <body class="architect-grid">
    <div id="root"></div>
  </body>
</html>
